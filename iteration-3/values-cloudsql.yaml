global:
  imagePullSecrets:
    - rhdh-pull-secret
  host: rhdh.zapto.org
  dynamic:
    includes:
      - dynamic-plugins.default.yaml
    plugins:    
    - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-dynamic
      disabled: true
    - package: ./dynamic-plugins/dist/janus-idp-backstage-plugin-rbac
      disabled: false
    - package: ./dynamic-plugins/dist/janus-idp-backstage-plugin-topology
      disabled: false
    - package: ./dynamic-plugins/dist/backstage-plugin-techdocs-backend-dynamic
      disabled: false
                              
route:
  enabled: false
upstream:
  serviceAccount: 
    name: 'devhub-sa'
    create: true
    annotations:
      iam.gke.io/gcp-service-account: 'rhdh-gsa@openenv-gzl5j.iam.gserviceaccount.com'
  service:
    ports:
      backend: 443
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations: 
      cloud.google.com/l4-rbs: "enabled"
      networking.gke.io/managed-certificates: "rhdh-cert"      
  ingress:
    enabled: false
    annotations:
      kubernetes.io/ingress.class: gce
      networking.gke.io/managed-certificates: "rhdh-cert"
  postgresql:
    enabled: false                    
  backstage:      
    image:
      pullSecrets:
      - rhdh-pull-secret
      registry: registry.redhat.io #optional
      repository: rhdh/rhdh-hub-rhel9 #optional
      tag: "1.3" #optional
    podSecurityContext:
      # you can assign any random value as fsGroup
      fsGroup: 2000
    appConfig:
      backend:
        https: 
          certificate:
            key: ${BACKSTAGE_SSL_KEY} # key in pem format 
            cert: ${BACKSTAGE_SSL_CERT} # cert in pem format   
        database:
          client: pg
          # ensureExists: false
          # pluginDivisionMode: 'schema'
          # knexConfig:
          #   searchPath: ['knex', 'public']
          connection:
            host: '127.0.0.1'
            port: '5432'
            user: ${DB_USER}
            password: ${DB_PASSWORD}
          prefix: backstage_demo_ 
      auth:
        environment: development
        providers:
          guest:
            dangerouslyAllowOutsideDevelopment: true
      techdocs:
        # builder: external
        publisher:
          type: 'googleGcs'
          googleGcs:
            bucketName: 'rhdh-bucket'
    extraEnvVarsSecrets:
      - rhdh-secret
      - tls-secret        
    extraEnvVars:
    - name: GLOBAL_AGENT_HTTP_PROXY
      value: "http://10.192.0.25:80"   
    - name: NO_PROXY
      value: "169.254.169.254,*.githubusercontent.com,localhost,127.0.0.1,*.googleapis.com"
    - name: LOG_LEVEL
      value: debug
    - name: TZ
      value: "Australia/Melbourne"
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: '0'
    - name: BACKEND_SECRET
      valueFrom:
        secretKeyRef:
          key: backend-secret
          name: rhdh-auth            
    resources:
      requests:
        cpu: 2
        memory: 4Gi  
    livenessProbe:
      httpGet:
        scheme: HTTPS 
    readinessProbe:
      httpGet:
        scheme: HTTPS
    extraContainers:
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy
        args:
          - "--structured-logs"
          - "--port=5432"
          - "openenv-gzl5j:australia-southeast2:devhub"
          - "--private-ip"
        securityContext:
          runAsNonRoot: true
