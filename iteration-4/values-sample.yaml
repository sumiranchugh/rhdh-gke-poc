global:
  imagePullSecrets:
    - rhdh-pull-secret
  host: rhdh.zapto.org
  dynamic:
    includes:
      - dynamic-plugins.default.yaml
    plugins:       
      - package: ./dynamic-plugins/dist/janus-idp-backstage-plugin-rbac
        disabled: false
      - package: ./dynamic-plugins/dist/janus-idp-backstage-plugin-topology
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-techdocs-backend-dynamic
        disabled: false 
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-msgraph-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-dynamic
        disabled: true
      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
        disabled: true
      
route:
  enabled: false
upstream:
  serviceAccount: 
    name: 'devhub-sa'
    create: true
    annotations:
      iam.gke.io/gcp-service-account: 'rhdh-gsa@openenv-gzl5j.iam.gserviceaccount.com'
  service:
    ports:
      backend: 443
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations: 
      cloud.google.com/l4-rbs: "enabled"
      networking.gke.io/managed-certificates: "rhdh-cert"      
  ingress:
    enabled: false
    annotations:
      kubernetes.io/ingress.class: gce
      networking.gke.io/managed-certificates: "rhdh-cert"
  postgresql:
    enabled: false                    
  backstage:      
    image:
      pullSecrets:
      - rhdh-pull-secret
      registry: registry.redhat.io #optional
      repository: rhdh/rhdh-hub-rhel9 #optional
      tag: "1.3" #optional
    podSecurityContext:
      # you can assign any random value as fsGroup
      fsGroup: 2000
    resources:
      requests:
        cpu: 2
        memory: 4Gi  
    livenessProbe:
      httpGet:
        scheme: HTTPS 
    readinessProbe:
      httpGet:
        scheme: HTTPS             
    appConfig:
      backend:
        https: 
          certificate:
            key: ${BACKSTAGE_SSL_KEY} # key in pem format 
            cert: ${BACKSTAGE_SSL_CERT} # cert in pem format 
        database:
          client: pg
          # ensureExists: false
          # pluginDivisionMode: 'schema'
          # knexConfig:
          #   searchPath: ['knex', 'public']
          connection:
            host: '127.0.0.1'
            port: '5432'
            user: ${DB_USER}
            password: ${DB_PASSWORD}
          prefix: devhub_plugin_ 
    extraAppConfig:
      - configMapRef: app-config-rhdh
        filename: app-config-rhdh.yaml
    extraEnvVars:
    - name: GLOBAL_AGENT_HTTPS_PROXY
      value: "http://10.192.0.25:80"
    - name: HTTPS_PROXY
      value: "http://10.192.0.25:80"
    - name: GLOBAL_AGENT_HTTP_PROXY
      value: "http://10.192.0.25:80"
    - name: HTTP_PROXY
      value: "http://10.192.0.25:80" 
    - name: GLOBAL_AGENT_NO_PROXY
      value: "169.254.169.254,.githubusercontent.com,localhost,127.0.0.1,.googleapis.com,.github.com,rhdh.zapto.org"                 
    - name: NO_PROXY
      value: "169.254.169.254,.githubusercontent.com,localhost,127.0.0.1,.googleapis.com,.github.com,rhdh.zapto.org"
    - name: LOG_LEVEL
      value: debug
    - name: TZ
      value: "Australia/Melbourne"
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: '0'
    extraEnvVarsSecrets:
      - rhdh-secret
      - tls-secret                 
    extraVolumeMounts:
      - mountPath: /opt/app-root/src/rbac-policy.csv
        subPath: rbac-policy.csv
        name: rbac-policy
      - mountPath: /opt/app-root/src/conditional-policy.yaml
        subPath: conditional-policy.yaml
        name: conditional-policy     
      # - mountPath: /opt/app-root/src/app-config-rhdh.yaml
      #   name: app-config-rhdh
      #   subPath: app-config-rhdh.yaml
      # - mountPath: /opt/app-root/src/app-config-from-configmap.yaml
      #   name: backstage-app-config
      #   subPath: app-config.yaml
      - mountPath: /opt/app-root/src/dynamic-plugins-root
        name: dynamic-plugins-root
      - mountPath: /var/log/audit
        name: audit-log-data     
    extraVolumes:
        # - name: app-config-rhdh
        #   configMap:
        #     name: app-config-rhdh
        - configMap:
            name: rbac-policy
          name: rbac-policy
        - configMap:
            name: conditional-policy
          name: conditional-policy
        - name: dynamic-plugins-root
          persistentVolumeClaim:
            claimName: 'rhdh-dynamic-plugins-root'
        - configMap:
            defaultMode: 420
            name: 'rhdh-dynamic-plugins'
            optional: true
          name: dynamic-plugins
        - name: dynamic-plugins-npmrc
          secret:
            defaultMode: 420
            optional: true
            secretName: 'rhdh-dynamic-plugins-npmrc'
        - name: dynamic-plugins-registry-auth
          secret:
            defaultMode: 416
            optional: true
            secretName: rhdh-dynamic-plugins-registry-auth
        - emptyDir: {}
          name: npmcacache
        - name: audit-log-data
          persistentVolumeClaim:
            claimName: rhdh-audit-log
        # - name: backstage-app-config
        #   configMap:
        #     name: rhdh-developer-hub-app-config
    extraContainers:
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy
        args:
          - "--structured-logs"
          - "--port=5432"
          - "openenv-gzl5j:australia-southeast2:devhub"
          - "--private-ip"
        securityContext:
          runAsNonRoot: true    
